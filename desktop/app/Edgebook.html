/*
VOICE: a precise trading instrument — calm, dense, confident; numbers first.
IDEA: the trader's own charting terminal turned into a logbook: dark panes, candles, ruled price levels.
PICTURE: the equity curve and annotated chart screenshots carry every page.
COLOUR and TYPE: Hibiki palette — olive-charcoal ground, sage/mint accent, butter for the primary action, leaf/clay for P&L; Plus Jakarta Sans + Cascadia Code tabular numerals.
LAYOUT: fixed left rail, filter bar, content up to 1440px in cards; stacks to one column with a bottom bar on phones.
*/
:root {
  --bg: #1b1d16; --bg2: #1f211a; --card: #23261d; --card2: #2a2d22; --card3: #32352a;
  --line: rgba(242, 237, 224, .1); --line2: rgba(242, 237, 224, .2);
  --ink: #f2ede0; --ink2: #c3bea9; --muted: #9a9883;
  --accent: #7d8c5f; --accent2: #b9c79c; --accent-soft: rgba(125, 140, 95, .2);
  --primary: #f3d67c; --primary-hover: #f7e09a; --on-primary: #2b2e22;
  --pos: #a9c27a; --neg: #d98d6c; --warn: #f3d67c; --info: #b9c79c;
  --pos-soft: rgba(169, 194, 122, .15); --neg-soft: rgba(217, 141, 108, .15);
  --backdrop: rgba(14, 15, 11, .6); --on-danger: #2b2e22;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  --r: 18px; --r-sm: 11px;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
/* Hibiki's light cream theme: olive ink on cream, darker sage/butter where they are text */
:root[data-eb-theme=light] {
  --bg: #f1ede2; --bg2: #ebe6d9; --card: #faf8f1; --card2: #f4f1e8; --card3: #e9e5d8;
  --line: rgba(43, 46, 34, .12); --line2: rgba(43, 46, 34, .22);
  --ink: #2b2e22; --ink2: #4f5243; --muted: #65665a;
  --accent: #6b7a4e; --accent2: #56653b; --accent-soft: rgba(107, 122, 78, .14);
  --primary: #ecc961; --primary-hover: #e4bd4c; --on-primary: #2b2e22;
  --pos: #55722a; --neg: #9c4a2e; --warn: #85651a; --info: #56653b;
  --pos-soft: rgba(111, 143, 62, .14); --neg-soft: rgba(156, 74, 46, .12);
  --backdrop: rgba(60, 58, 40, .25); --on-danger: #fff;
  --shadow: 0 10px 40px rgba(70, 66, 40, .22);
  color-scheme: light;
}
:root[data-pnl=blueorange] { --pos: #3B82F6; --neg: #F97316; --pos-soft: rgba(59, 130, 246, .15); --neg-soft: rgba(249, 115, 22, .15); }

* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: clamp(24px, 2.6vw, 32px); text-wrap: balance; }
h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
p { margin: 0; }
a { color: var(--accent2); text-decoration: none; } a:hover { text-decoration: underline; }
:root[data-eb-theme=light] .view a, :root[data-eb-theme=light] .modal a { color: var(--accent); }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line2); background: var(--card2); color: var(--muted); white-space: nowrap; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .flat { color: var(--ink2); }
.arw { font-style: normal; font-size: .72em; margin-right: 3px; vertical-align: 1px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .grow { flex: 1; }
.sr, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip:focus { position: fixed; top: 8px; left: 8px; z-index: 100; background: var(--primary); color: var(--on-primary); padding: 8px 12px; border-radius: 8px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; border-radius: 6px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px; border-right: 1px solid var(--line); background: var(--bg2); }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; color: var(--ink); font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.logo:hover { text-decoration: none; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a, .side-btn { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--ink2); font-weight: 500; border: 0; background: none; font: inherit; cursor: pointer; text-align: left; width: 100%; }
.side nav a:hover, .side-btn:hover { background: var(--card); text-decoration: none; color: var(--ink); }
.side nav a.on { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.side nav a.on .ic { color: var(--accent2); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.side-btn kbd { margin-left: auto; }
.main-col { display: flex; flex-direction: column; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px clamp(16px, 2.4vw, 32px); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; transition: opacity .2s; }
.filters.dim { opacity: .55; }
.filters .input.sm { width: auto; }
.custom .input.sm { width: 150px; }
.custom { display: inline-flex; gap: 6px; align-items: center; }
#view { padding: clamp(16px, 2.4vw, 32px); padding-bottom: 110px; max-width: 1480px; width: 100%; outline: none; }
.view { display: flex; flex-direction: column; gap: 18px; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-h p { margin-top: 6px; }
.page-h .input { width: auto; }
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 30; width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--primary); color: var(--on-primary); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); cursor: pointer; display: grid; place-items: center; transition: transform .15s, box-shadow .15s; }
.fab:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
.bottom-nav { display: none; }
.only-sm { display: none !important; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card2); color: var(--ink); font: 500 14px var(--font); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s; text-decoration: none !important; }
.btn:hover { background: var(--card3); border-color: var(--line2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: transparent; color: var(--on-primary); font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
.btn.primary:hover { background: var(--primary-hover); box-shadow: 0 6px 22px rgba(0, 0, 0, .35); }
.btn.primary kbd { background: rgba(43, 46, 34, .1); color: var(--on-primary); border-color: rgba(43, 46, 34, .25); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--card2); }
.btn.danger { background: var(--neg); color: var(--on-danger); border-color: transparent; }
.btn.danger-ghost { background: transparent; color: var(--neg); border-color: color-mix(in srgb, var(--neg) 40%, transparent); }
.btn.danger-ghost:hover { background: var(--neg-soft); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 15px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-row.center { justify-content: center; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--ink2); cursor: pointer; font: 600 14px var(--font); flex: none; }
.icon-btn:hover { background: var(--card2); color: var(--ink); }
.icon-btn.on { color: var(--accent2); background: var(--accent-soft); }
.icon-btn.star.on, .icon-btn.on .ic[stroke] { color: var(--primary); }
.icon-btn.xs { width: 26px; height: 26px; font-size: 11px; }
.icon-btn[disabled] { opacity: .3; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent2); font: inherit; cursor: pointer; }
.input { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); color: var(--ink); font: 15px var(--font); transition: border-color .15s, box-shadow .15s; }
.input:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line2)); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; border-radius: 8px; }
.input.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.input.mono { font-family: var(--mono); font-size: 12px; }
.input.inline { display: inline-block; width: auto; min-height: 30px; padding: 2px 8px; font: 600 16px var(--font); }
.input.color { padding: 4px; height: 40px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
select.input.sm { padding-right: 30px; }
textarea.input { resize: vertical; line-height: 1.5; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span:first-child { font-size: 13px; color: var(--ink2); font-weight: 500; }
.req { color: var(--accent2); margin-left: 2px; }
.hint { color: var(--muted); font-size: 12px; }
.msg { font-style: normal; font-size: 12px; min-height: 0; }
.msg.err { color: var(--neg); } .msg.warn { color: var(--warn); }
.msg:empty { display: none; }
.field.has-err .input { border-color: var(--neg); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.check.sm { font-size: 13px; }
.switch { padding: 6px 0; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--card2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font: 500 13px var(--font); padding: 6px 12px; border-radius: 8px; cursor: pointer; min-height: 32px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.seg.sm button { padding: 4px 9px; font-size: 12px; min-height: 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--ink2); font: 500 13px var(--font); cursor: pointer; transition: all .12s; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--ink); }
.chips.warn .chip.on, .chip.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--ink); }
.chip.xs { min-height: 22px; padding: 1px 8px; font-size: 12px; cursor: default; }
.chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; padding: 0 0 0 2px; line-height: 1; }
.chips.emo .chip { padding-left: 8px; }
.chips.grades .chip { min-width: 44px; justify-content: center; font-family: var(--mono); }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 4px; cursor: pointer; color: var(--line2); border-radius: 6px; }
.stars button.on { color: var(--primary); } .stars button.on svg { fill: currentColor; }
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 7px; font: 600 12px var(--font); white-space: nowrap; }
.badge.long { background: var(--pos-soft); color: var(--pos); } .badge.short { background: var(--neg-soft); color: var(--neg); }
.badge.sm { padding: 1px 6px; font-size: 11px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 11px var(--font); background: var(--card3); color: var(--ink2); text-transform: capitalize; }
.pill.win { background: var(--pos-soft); color: var(--pos); } .pill.loss { background: var(--neg-soft); color: var(--neg); }
.pill.sm { font-size: 10px; padding: 0 6px; }
.grade { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 6px; font: 700 12px var(--mono); background: var(--card3); }
.grade.g-A { color: var(--pos); background: var(--pos-soft); } .grade.g-D, .grade.g-F { color: var(--neg); background: var(--neg-soft); } .grade.g-C { color: var(--warn); }
.star-mini { color: var(--primary); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.sw.on { border-color: var(--ink); }
.sw.custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sw-mini { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sc, var(--accent)); margin-right: 6px; vertical-align: 1px; }
.progress { height: 6px; border-radius: 4px; background: var(--card3); overflow: hidden; } .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* ---------- Cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; transition: border-color .2s, box-shadow .2s; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h2 { display: flex; align-items: center; gap: 8px; }
.empty { text-align: center; padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .es-a { fill: var(--card2); stroke: var(--line2); } .empty .es-l { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .empty .es-d { fill: var(--accent); }
.empty-chart { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; }
.banner { padding: 10px 18px; background: var(--accent-soft); display: flex; align-items: center; gap: 12px; font-size: 14px; }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.kpi:hover { border-color: var(--line2); box-shadow: 0 0 0 1px var(--line2), 0 0 24px rgba(125, 140, 95, .1); }
.kpi header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi-v { font-size: clamp(20px, 2vw, 26px); font-weight: 600; }
.kpi footer { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.delta { font-size: 12px; }
.spark-l { fill: none; stroke: var(--accent2); stroke-width: 1.6; } .spark-a { fill: var(--accent-soft); }
.spark.up .spark-l { stroke: var(--pos); } .spark.up .spark-a { fill: var(--pos-soft); }
.spark.down .spark-l { stroke: var(--neg); } .spark.down .spark-a { fill: var(--neg-soft); }
.dash-main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.dash-two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.chart-lg { height: 360px; } .chart-md { height: 280px; }
.fig { position: relative; } .fig > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--card3); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; line-height: 1.45; }
.gl { stroke: var(--line); stroke-width: 1; } .gl.zero { stroke: var(--line2); }
.axl { fill: var(--muted); font: 11px var(--mono); } .axt { fill: var(--muted); font: 12px var(--font); }
.eq-line { fill: none; stroke: var(--accent2); stroke-width: 2.2; stroke-linejoin: round; } .eq-dot { fill: var(--accent2); stroke: var(--card); stroke-width: 2; }
.dd-area { fill: var(--neg-soft); stroke: var(--neg); stroke-width: 1; opacity: .9; }
.hl { stroke: var(--line2); stroke-dasharray: 3 3; }
.dot { stroke: var(--card); stroke-width: 1.5; opacity: .9; } .dot.pos { fill: var(--pos); } .dot.neg { fill: var(--neg); } .dot.flat { fill: var(--muted); }
.dot-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.hbar.pos { fill: var(--pos); } .hbar.neg { fill: var(--neg); } .hbar.flat { fill: var(--muted); }
.insights { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.ins { display: flex; gap: 12px; padding: 11px 12px; border-radius: 11px; background: var(--card2); border: 1px solid var(--line); }
.ins.neg { box-shadow: inset 3px 0 0 var(--neg); } .ins.pos { box-shadow: inset 3px 0 0 var(--pos); } .ins.neutral { box-shadow: inset 3px 0 0 var(--accent); }
.ins b { font-size: 14px; font-weight: 600; } .ins p { margin-top: 3px; }
.ins-i { font-size: 18px; line-height: 1.2; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, .9fr); gap: 5px; }
.cal-h { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal-c { position: relative; min-height: 66px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); padding: 6px 7px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; font: inherit; cursor: pointer; transition: transform .12s, border-color .12s; }
.cal-c:hover:not(.pad):not(.wk) { border-color: var(--accent); transform: translateY(-1px); }
.cal-c.pad { background: transparent; border-color: transparent; cursor: default; }
.cal-c.pos { background: color-mix(in srgb, var(--pos) calc(var(--a) * 42%), var(--card2)); border-color: color-mix(in srgb, var(--pos) 35%, transparent); }
.cal-c.neg { background: color-mix(in srgb, var(--neg) calc(var(--a) * 42%), var(--card2)); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
.cal-c.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-c.wk { cursor: default; background: transparent; border-style: dashed; }
.cal-c.wk.pos b { color: var(--pos); } .cal-c.wk.neg b { color: var(--neg); }
.cal-d { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 4px; }
.cal-c b { font-size: 13px; } .cal-c small { font-size: 10px; color: var(--ink2); opacity: .8; }
.cal-h.wk { color: var(--muted); }
.jdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); }
.cal-foot { margin-top: 10px; }
.lessons { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.lessons li { padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.lessons li:hover { background: var(--card2); }
.lessons p { font-size: 14px; color: var(--ink); }
.lessons.big p { font-size: 16px; }
.ls-split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.ls-split > div { display: flex; flex-direction: column; gap: 2px; } .ls-split b { font-size: 17px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 260px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.strip-card { scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); cursor: pointer; text-align: left; font: inherit; transition: transform .15s, border-color .15s, box-shadow .15s; }
.strip-card:hover { transform: translateY(-2px); border-color: var(--line2); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.strip-card .thumb, .strip-card .thumb-empty { aspect-ratio: 16/9; border-radius: 8px; }
.strip-m { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.thumb { width: 100%; display: block; object-fit: cover; background: #14160f; border-radius: 8px; aspect-ratio: 16/9; }
.thumb.mini { width: 76px; height: 43px; border-radius: 5px; }
.thumb-empty { display: grid; place-items: center; align-content: center; gap: 4px; aspect-ratio: 16/9; border-radius: 8px; background: var(--card2); color: var(--muted); border: 1px dashed var(--line2); width: 100%; }
.thumb-empty.mini { width: 76px; height: 43px; }
.hero { text-align: center; padding: clamp(28px, 5vw, 60px) 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; background: radial-gradient(ellipse at top, var(--accent-soft), transparent 60%), var(--card); }
.hero-art { width: min(520px, 100%); height: auto; }
.hero h1 { font-size: clamp(28px, 4vw, 44px); max-width: 16ch; }
.hero p { max-width: 56ch; }

/* ---------- Trade log ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; }
.toolbar .input.sm { width: auto; }
.search { position: relative; flex: 1 1 260px; display: flex; align-items: center; }
.search .ic { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 34px; min-height: 34px; font-size: 14px; }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-soft); }
.table-wrap { overflow-x: auto; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--card); z-index: 1; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; }
.log tbody tr { cursor: pointer; transition: background .1s; }
.log tbody tr:hover, .log tbody tr:focus-visible { background: var(--card2); }
.log tr.sel { background: var(--accent-soft) !important; }
.log tr.o-win td:nth-child(2) { box-shadow: inset 3px 0 0 var(--pos); } .log tr.o-loss td:nth-child(2) { box-shadow: inset 3px 0 0 var(--neg); }
.cb { width: 36px; } .td-img { width: 92px; padding: 5px 8px; } .th-img { width: 92px; }
.sort { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; } .sort.on { color: var(--ink); }
.more { display: flex; justify-content: center; padding: 14px; }
.gallery { columns: 4 280px; column-gap: 14px; }
.g-card { break-inside: avoid; margin-bottom: 14px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.g-card:hover { transform: translateY(-2px); border-color: var(--line2); box-shadow: 0 0 0 1px var(--line2), 0 10px 30px rgba(0, 0, 0, .25); }
.g-card .thumb { aspect-ratio: auto; }
.g-meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 4px; }
.g-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 0 4px; }
.g-lesson { padding: 0 4px 4px; }
.col-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-table { font-size: 12px; } .mini-table td, .mini-table th { padding: 6px 8px; white-space: nowrap; }

/* ---------- Modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: var(--backdrop); backdrop-filter: blur(4px); animation: fadein .15s ease; }
.modal-wrap.out { opacity: 0; transition: opacity .15s; }
.modal { width: 100%; max-height: calc(100vh - 40px); overflow: auto; background: var(--card); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: pop .18s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.modal.sm { max-width: 440px; } .modal.md { max-width: 640px; } .modal.lg { max-width: 920px; } .modal.xl { max-width: 1180px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 6px; }
.modal-b { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card); }
.modal-f.inline { padding: 12px 0 0; position: static; }
.modal-wrap.full { padding: 0; }
.modal.full { max-width: none; max-height: none; height: 100vh; height: 100dvh; border-radius: 0; border: 0; overflow: hidden; }
.modal.full > .modal-b { padding: 0; height: 100%; gap: 0; }
.modal-wrap.sheet { align-items: end; }
@media (min-width: 700px) { .modal-wrap.sheet { align-items: center; } }
#toasts { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--card3); border: 1px solid var(--line2); box-shadow: var(--shadow); font-size: 14px; max-width: min(560px, 92vw); animation: pop .2s; }
.toast.ok { border-color: color-mix(in srgb, var(--pos) 50%, transparent); } .toast.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); } .toast.error { border-color: var(--neg); }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .35s; }
.kbd-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; font-size: 14px; }
.kbd-grid kbd { justify-self: end; }
.steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 6px; counter-reset: s; }
.steps li { flex: 1; counter-increment: s; font-size: 12px; color: var(--muted); padding-top: 8px; border-top: 3px solid var(--line2); }
.steps li::before { content: counter(s) '  '; font-family: var(--mono); }
.steps li.on { color: var(--ink); border-color: var(--accent); }
.ob-done ul { margin: 12px 0 0; padding-left: 18px; line-height: 2; }

/* palette */
.palette .modal { max-width: 620px; align-self: start; margin-top: 12vh; }
.palette .modal-b { padding: 0; gap: 0; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.pal-in .input { border: 0; background: none; box-shadow: none !important; padding: 6px 0; font-size: 16px; }
#pal-list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
#pal-list li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 14px; }
#pal-list li.on { background: var(--accent-soft); }
.pal footer { padding: 8px 16px; border-top: 1px solid var(--line); }

/* ---------- Trade editor ---------- */
.te { display: flex; flex-direction: column; height: 100%; }
.te-h { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--bg2); }
.te-title { display: flex; align-items: center; gap: 12px; }
.te-title h2 { font-size: 19px; }
.te-live { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.te-live .calc-cell { min-width: 108px; padding: 6px 12px; }
.te-actions { display: flex; gap: 8px; align-items: center; }
.te-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr); min-height: 0; }
.te-form { overflow: auto; padding: 16px 20px 60px; display: flex; flex-direction: column; gap: 12px; }
.te-media { overflow: auto; padding: 16px 20px 60px; border-left: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; gap: 12px; }
.err-sum { padding: 10px 14px; border-radius: 10px; background: var(--neg-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--neg) 50%, transparent); font-size: 14px; }
.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.sec > summary { display: flex; align-items: baseline; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 600; list-style: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: '›'; display: inline-block; transition: transform .15s; color: var(--muted); font-size: 18px; line-height: 1; }
.sec[open] > summary::before { transform: rotate(90deg); }
.sec-b { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
fieldset.sub { border: 1px dashed var(--line2); border-radius: 12px; padding: 12px; margin: 0; }
fieldset.sub legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
.dir-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dir { min-height: 50px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); color: var(--ink2); font: 600 16px var(--font); cursor: pointer; transition: all .15s; }
.dir.long.on { background: var(--pos-soft); border-color: var(--pos); color: var(--pos); box-shadow: 0 0 20px color-mix(in srgb, var(--pos) 20%, transparent); }
.dir.short.on { background: var(--neg-soft); border-color: var(--neg); color: var(--neg); box-shadow: 0 0 20px color-mix(in srgb, var(--neg) 20%, transparent); }
.calc-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.calc-cell { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); }
.calc-cell span { font-size: 11px; color: var(--muted); }
.calc-cell b { font-size: 15px; font-weight: 600; }
.calc-grid.big b { font-size: 18px; }
.exec-table { display: flex; flex-direction: column; gap: 6px; }
.exec-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.4fr 36px; gap: 6px; align-items: center; }
.exec-row.head span { font-size: 11px; color: var(--muted); }
.exec-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.targets { display: flex; flex-direction: column; gap: 6px; }
.tp { display: flex; gap: 6px; }
.sizer:empty { display: none; }
.sizer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); }
.rules { display: flex; flex-direction: column; gap: 4px; }
.rule { padding: 8px 10px; border-radius: 9px; background: var(--card2); justify-content: flex-start; }
.rule small { margin-left: auto; }
.inline-add { display: flex; gap: 6px; margin-top: 6px; max-width: 380px; }
.tag-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); }
.tag-input .input { border: 0; background: none; box-shadow: none !important; flex: 1 1 160px; width: auto; }

  const h = Math.max(o, c) + Math.abs(gauss(rand)) * vol * 0.6;
  const l = Math.min(o, c) - Math.abs(gauss(rand)) * vol * 0.6;
  return { o, h, l, c, v: 0.4 + rand() * 0.6 + Math.abs(c - o) / vol * 0.3 };
}

function chartModel(tok) {
  const p = parseToken(tok);
  const s = series(p);
  let candles = s.candles, offset = 0;
  if (p.variant === 'entry') candles = s.candles.slice(0, s.exitIdx + 5);
  if (p.variant === 'htf') {
    const agg = [];
    for (let i = 0; i < s.candles.length; i += 3) {
      const g = s.candles.slice(i, i + 3);
      agg.push({ o: g[0].o, c: g[g.length - 1].c, h: Math.max(...g.map((x) => x.h)), l: Math.min(...g.map((x) => x.l)), v: g.reduce((a, x) => a + x.v, 0) / 2 });
    }
    candles = agg; offset = -1;
  }
  const lo = Math.min(...candles.map((c) => c.l), s.stop, p.variant === 'htf' ? Infinity : s.target);
  const hi = Math.max(...candles.map((c) => c.h), s.stop, p.variant === 'htf' ? -Infinity : s.target);
  const padP = (hi - lo) * 0.08;
  const yMin = lo - padP, yMax = hi + padP;
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  const step = plotW / (candles.length + 3);
  const xOf = (i) => PAD.l + step * (i + 0.5);
  const yOf = (v) => PAD.t + (1 - (v - yMin) / (yMax - yMin)) * plotH;
  const ei = offset < 0 ? Math.floor(s.entryIdx / 3) : s.entryIdx;
  const xi = offset < 0 ? Math.floor(s.exitIdx / 3) : s.exitIdx;
  return {
    p, s, candles, xOf, yOf, step, yMin, yMax,
    meta: {
      entryX: xOf(ei), exitX: xOf(xi), entryY: yOf(s.entry), stopY: yOf(s.stop), targetY: yOf(s.target), exitY: yOf(s.exitPx),
      entry: s.entry, stop: s.stop, target: s.target, exit: s.exitPx, mae: s.mae, mfe: s.mfe,
    },
  };
}

function renderChart(tok) {
  if (cache.has(tok)) return cache.get(tok);
  const m = chartModel(tok);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#131722'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
  const decimals = m.p.base < 5 ? 4 : 2;
  for (let i = 0; i <= 8; i++) {
    const y = PAD.t + (i / 8) * (H - PAD.t - PAD.b);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W - PAD.r, y); g.stroke();
    const v = m.yMax - (i / 8) * (m.yMax - m.yMin);
    g.fillStyle = '#787b86'; g.font = '13px ui-monospace, Menlo, monospace'; g.textAlign = 'left';
    g.fillText(v.toFixed(decimals), W - PAD.r + 10, y + 4);
  }
  for (let i = 0; i < m.candles.length; i += 8) { const x = m.xOf(i); g.beginPath(); g.moveTo(x, PAD.t); g.lineTo(x, H - PAD.b); g.stroke(); }
  // EMA
  let ema = m.candles[0].c; const k = 2 / 21;
  g.strokeStyle = '#2962ff'; g.lineWidth = 1.6; g.beginPath();
  m.candles.forEach((c, i) => { ema = c.c * k + ema * (1 - k); const x = m.xOf(i), y = m.yOf(ema); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  const bw = Math.max(2, m.step * 0.62);
  const vMax = Math.max(...m.candles.map((c) => c.v));
  m.candles.forEach((c, i) => {
    const up = c.c >= c.o, x = m.xOf(i);
    const col = up ? '#26a69a' : '#ef5350';
    g.fillStyle = up ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)';
    const vh = (c.v / vMax) * (PAD.b - 22);
    g.fillRect(x - bw / 2, H - vh - 8, bw, vh);
    g.strokeStyle = col; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x, m.yOf(c.h)); g.lineTo(x, m.yOf(c.l)); g.stroke();
    g.fillStyle = col;
    const y1 = m.yOf(Math.max(c.o, c.c)), y2 = m.yOf(Math.min(c.o, c.c));
    g.fillRect(x - bw / 2, y1, bw, Math.max(1.2, y2 - y1));
  });
  const last = m.candles[m.candles.length - 1];
  const ly = m.yOf(last.c);
  g.fillStyle = last.c >= last.o ? '#26a69a' : '#ef5350';
  g.fillRect(W - PAD.r + 2, ly - 11, PAD.r - 4, 22);
  g.fillStyle = '#fff'; g.font = 'bold 13px ui-monospace, Menlo, monospace'; g.fillText(last.c.toFixed(decimals), W - PAD.r + 10, ly + 4);
  g.fillStyle = '#d1d4dc'; g.font = '600 17px system-ui, sans-serif'; g.textAlign = 'left';
  const tf = m.p.variant === 'htf' ? ({ '1m': '5m', '5m': '15m', '15m': '1H', '1H': '4H', '4H': 'D', D: 'W' }[m.p.tf] || m.p.tf) : m.p.tf;
  g.fillText(`${m.p.symbol} · ${tf}`, 16, 28);
  g.fillStyle = '#787b86'; g.font = '13px system-ui, sans-serif';
  g.fillText(`O ${m.candles[0].o.toFixed(decimals)}  H ${Math.max(...m.candles.map((c) => c.h)).toFixed(decimals)}  L ${Math.min(...m.candles.map((c) => c.l)).toFixed(decimals)}  C ${last.c.toFixed(decimals)}   EMA 20`, 140, 28);
  g.fillStyle = 'rgba(255,255,255,0.035)'; g.font = '700 96px system-ui, sans-serif'; g.textAlign = 'center';
  g.fillText(m.p.symbol, (W - PAD.r) / 2, H / 2);
  const url = cv.toDataURL('image/jpeg', 0.86);
  cache.set(tok, url);
  return url;
}

  function renderVoice() {
    const el = root.querySelector('[data-voice]');

      ? `<audio controls src="${esc(model.voice)}"></audio><button type="button" class="btn sm ghost" data-del-voice>Remove memo</button>`

  }

  function updateCalc() {
    const acc = account(model.accountId);
    const bal = balanceAt(model.accountId, model.entryTime);
    const c = calcTrade(model, { ...calcOpts(), accountBalance: bal });
    const set = (k, txtv, cls = '') => root.querySelectorAll(`[data-calc="${k}"]`).forEach((el) => { el.textContent = txtv; el.className = `num ${cls}`; });
    const isOpen = c.outcome === 'open';
    set('risk', c.risk != null ? money(c.risk, { sign: false }) : '—');
    set('riskPct', c.riskPct != null ? pct(c.riskPct, 2) : '—', c.riskPct > (acc?.defaultRiskPct || 1) * 1.5 ? 'neg' : '');
    set('plannedRR', c.plannedRR != null ? `1 : ${fixed(c.plannedRR, 2)}` : '—');
    set('r', isOpen ? 'open' : fmtR(c.r), tone(c.r));
    set('net', isOpen ? 'open' : money(c.net), tone(c.net));
    set('gross', isOpen ? '—' : money(c.gross), tone(c.gross));
    set('fees', money(-c.fees), c.fees ? 'neg' : '');
    set('pnlPct', c.pnlPct != null ? (c.pnlPct > 0 ? '+' : '') + pct(c.pnlPct, 2) : '—', tone(c.pnlPct));
    set('outcome', { win: 'Win', loss: 'Loss', breakeven: 'Breakeven', open: 'Open' }[c.outcome], c.outcome === 'win' ? 'pos' : c.outcome === 'loss' ? 'neg' : '');
    set('efficiency', c.efficiency != null ? pct(c.efficiency, 0) : '—');
    set('holding', duration(c.holdingMs));
    set('mae', c.maeDollar != null ? money(-c.maeDollar) : '—', 'neg');
    set('mfe', c.mfeDollar != null ? money(c.mfeDollar) : '—', 'pos');
    set('balance', money(bal, { sign: false }));
    set('avgEntry', fmtPrice(c.avgEntry)); set('avgExit', fmtPrice(c.avgExit)); set('openSize', qty(c.openSize));
    set('adherence', c.ruleAdherence != null ? pct(c.ruleAdherence, 0) : '—');
    const rp = root.querySelector('[data-risk-ph]');
    if (rp) {
      const autoRisk = c.risk != null && !(Number(model.riskOverride) > 0) ? c.risk : null;
      rp.placeholder = autoRisk != null ? money(autoRisk, { sign: false }).replace(/[^0-9.,]/g, '') : 'auto';
    }
    // Position sizer suggestion
    const sz = root.querySelector('[data-sizer]');
    if (sz) {
      const entry = Number(model.entryPrice), stop = Number(model.stop);
      if (acc && entry > 0 && stop > 0 && entry !== stop && !multiExec) {
        const budget = bal * (acc.defaultRiskPct / 100);
        const per = Math.abs(entry - stop) * c.multiplier;
        let n = budget / per;
        n = ['Crypto'].includes(model.assetClass) ? Math.floor(n * 1000) / 1000 : Math.floor(n);
        sz.innerHTML = n > 0 ? `<span class="muted small">${icon('bolt', 14)} At ${acc.defaultRiskPct}% risk (${money(budget, { sign: false })}) your size would be <b class="num">${qty(n)}</b>.</span> <button type="button" class="btn sm ghost" data-apply-size="${n}">Use ${qty(n)}</button>` : '';
      } else sz.innerHTML = '';
    }
    // Validation
    const v = validateTrade(model);
    root.querySelectorAll('[data-msg]').forEach((el) => {
      const k = el.dataset.msg;
      const err = showErrors ? v.errors[k] : null, warn = v.warnings[k];
      el.textContent = err || warn || '';
      el.className = `msg ${err ? 'err' : warn ? 'warn' : ''}`;
      el.closest('.field')?.classList.toggle('has-err', !!err);
    });
    const sum = root.querySelector('.err-sum');
    const n = Object.keys(v.errors).length;
    if (sum) { sum.hidden = !showErrors || !n; sum.textContent = n ? `Fix ${n} field${n > 1 ? 's' : ''} before saving: ${Object.values(v.errors).join(' ')}` : ''; }
    const badge = root.querySelector('.te-h .badge');
    if (badge) { badge.className = `badge ${model.direction}`; badge.textContent = model.direction === 'long' ? '▲ Long' : '▼ Short'; }
    return v;
  }

  // ---------- Events ----------
  root.addEventListener('input', (e) => {
    const f = e.target.dataset.f; if (!f) return;
    let v = e.target.value;
    if (e.target.dataset.t === 'num') v = v === '' ? null : Number(v);
    if (e.target.dataset.t === 'dt') v = fromLocalInput(v);
    if (f === 'symbol') { v = v.toUpperCase(); const p = e.target.selectionStart; e.target.value = v; e.target.setSelectionRange(p, p); }
    if (f.startsWith('targets.')) { setPath(model, f, v); model.targets = model.targets.map((x) => (x === '' ? null : x)).filter((x, i, a) => x != null || i < a.length - 1); }
    else setPath(model, f, v);
    if (f === 'accountId' || f === 'entryTime' || f === 'exitTime') {}
    markDirty(); updateCalc();
  });
  root.addEventListener('change', async (e) => {
    if (e.target.matches('[data-multi]')) {
      multiExec = e.target.checked;
      if (multiExec && !model.executions.length) {
        if (model.entryPrice) model.executions.push({ id: uid('ex'), side: 'entry', price: model.entryPrice, size: model.size, time: model.entryTime });
        else model.executions.push({ id: uid('ex'), side: 'entry', price: null, size: null, time: model.entryTime });
        if (model.exitPrice) model.executions.push({ id: uid('ex'), side: 'exit', price: model.exitPrice, size: model.size, time: model.exitTime || model.entryTime });
      } else if (!multiExec && model.executions.length) {
        const c = calcTrade(model);
        model.entryPrice = Number.isFinite(c.avgEntry) ? +c.avgEntry.toFixed(6) : null; model.exitPrice = c.avgExit != null ? +c.avgExit.toFixed(6) : null; model.size = c.entrySize || null;
        model.executions = [];
      }
      markDirty(); render(); return;
    }
    if (e.target.matches('[data-rule]')) { model.rulesChecked[e.target.dataset.rule] = e.target.checked; markDirty(); updateCalc(); return; }
    if (e.target.matches('[data-f="accountId"], select[data-f]')) { if (e.target.dataset.f === 'accountId') render(); return; }
    if (e.target.matches('[data-voice-file]')) {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 8e6) { toast('Audio files up to 8 MB', { tone: 'warn' }); return; }
      model.voice = await readFile(f); markDirty(); renderVoice();
    }
  });
  bindChips(root, (name, val) => {
    if (name === 'stopMoved') { model.stopMoved = val === 'yes' ? true : val === 'no' ? false : undefined; markDirty(); render(); return; }
    setPath(model, name, val);
    if (name === 'setupIds') {
      const valid = new Set(model.setupIds.flatMap((sid) => (getSetup(sid)?.rules || []).map((r) => r.id)));
      for (const k of Object.keys(model.rulesChecked)) if (!valid.has(k)) delete model.rulesChecked[k];
      for (const k of valid) if (!(k in model.rulesChecked)) model.rulesChecked[k] = false;
    }
    markDirty();
    if (['assetClass', 'setupIds', 'status'].includes(name)) render(); else updateCalc();
  });
  bindStars(root, (name, v) => { model[name] = v; markDirty(); });
  bindRich(root, (name, html) => { model[name] = html; markDirty(); });

  root.addEventListener('click', async (e) => {
    const t = e.target;
    const dirB = t.closest('[data-dir]');
    if (dirB) { model.direction = dirB.dataset.dir; root.querySelectorAll('[data-dir]').forEach((b) => { b.classList.toggle('on', b === dirB); b.setAttribute('aria-pressed', String(b === dirB)); }); markDirty(); updateCalc(); return; }
    if (t.closest('[data-add-exec]')) { const side = t.closest('[data-add-exec]').dataset.addExec; model.executions.push({ id: uid('ex'), side, price: null, size: null, time: side === 'exit' ? (model.exitTime || new Date().toISOString()) : model.entryTime }); markDirty(); render(); return; }
    if (t.closest('[data-del-exec]')) { model.executions.splice(+t.closest('[data-del-exec]').dataset.delExec, 1); markDirty(); render(); return; }
    if (t.closest('[data-add-tp]')) { model.targets.push(null); markDirty(); render(); return; }
    if (t.closest('[data-del-tp]')) { model.targets.splice(+t.closest('[data-del-tp]').dataset.delTp, 1); markDirty(); render(); return; }
    if (t.closest('[data-add-link]')) { model.links.push({ label: '', url: '' }); markDirty(); render(); return; }
    if (t.closest('[data-del-link]')) { model.links.splice(+t.closest('[data-del-link]').dataset.delLink, 1); markDirty(); render(); return; }
    if (t.closest('[data-del-tag]')) { model.tags.splice(+t.closest('[data-del-tag]').dataset.delTag, 1); markDirty(); render(); return; }
    if (t.closest('[data-apply-size]')) { model.size = Number(t.closest('[data-apply-size]').dataset.applySize); root.querySelector('[data-f="size"]').value = model.size; markDirty(); updateCalc(); return; }
    if (t.closest('[data-default-fees]')) { const acc = account(model.accountId); const c = calcTrade(model); model.fees = +((acc.defaultCommission || 0) * (c.entrySize + c.exitSize)).toFixed(2); root.querySelector('[data-f="fees"]').value = model.fees; markDirty(); updateCalc(); return; }
    if (t.closest('[data-star]')) { model.starred = !model.starred; const b = t.closest('[data-star]'); b.classList.toggle('on', model.starred); b.classList.toggle('star', model.starred); b.setAttribute('aria-pressed', String(model.starred)); markDirty(); return; }
    if (t.closest('[data-del-voice]')) { model.voice = null; markDirty(); renderVoice(); return; }
    if (t.closest('[data-rec]')) { record(t.closest('[data-rec]')); return; }
    if (t.closest('[data-save]')) { save(); return; }
    if (t.closest('[data-discard-draft]')) { clearDraft(); dirty = false; modal.close(true); toast('Draft discarded'); return; }
    if (t.closest('[data-delete]')) {
      if (await confirmDialog(`Delete this ${esc(model.symbol)} trade and its charts? This cannot be undone.`, { ok: 'Delete trade', danger: true })) {
        const snapshot = clone(existing);
        deleteTrades([model.id]); dirty = false; modal.close(true);

    if (e.key === 'Enter' && e.target.closest('[data-add-mistake]')) { e.preventDefault(); addMistake(e.target.closest('[data-add-mistake]')); return; }

    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  const onPaste = (e) => { if (!root.isConnected) return document.removeEventListener('paste', onPaste); if (e.target.closest?.('[data-rich]') && !e.clipboardData?.files?.length) return; root._media?.paste(e); };

  async function record(btn) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream); const parts = [];
      rec.ondataavailable = (ev) => parts.push(ev.data);
      const watch = setInterval(() => { if (rec.state === 'inactive') clearInterval(watch); else if (!root.isConnected) { clearInterval(watch); rec.stop(); } }, 500);
      rec.onstop = async () => { stream.getTracks().forEach((t) => t.stop()); if (!root.isConnected) return; const blob = new Blob(parts, { type: rec.mimeType }); model.voice = await readFile(blob); markDirty(); renderVoice(); };
      rec.start(); btn.textContent = '■ Stop recording'; btn.classList.add('rec');
      btn.onclick = (ev) => { ev.stopPropagation(); rec.stop(); };
    } catch { toast('Microphone is not available here — upload an audio file instead.', { tone: 'warn' }); }
  }

    { t: `Switch to ${state.settings.theme === 'dark' ? 'light' : 'dark'} mode`, k: 'theme dark light mode', run: () => setSettings({ theme: state.settings.theme === 'dark' ? 'light' : 'dark' }), ic: 'sun' },
    { t: 'Load sample data', k: 'sample demo seed', run: () => loadSample(), ic: 'sparkle' },
    { t: 'Keyboard shortcuts', k: 'help keyboard shortcuts ?', run: () => shortcuts(), ic: 'command' },
  ];
  const trades = [...allCalcs()].sort((a, b) => b.t.entryTime.localeCompare(a.t.entryTime));
  const m = openModal({ size: 'md', cls: 'palette', label: 'Command palette', body: `<div class="pal"><label class="pal-in">${icon('search', 18)}<input class="input" placeholder="Jump to a trade (symbol, setup, date) or run a command…" autofocus aria-label="Search commands and trades" role="combobox" aria-expanded="true" aria-controls="pal-list"></label><ul id="pal-list" role="listbox"></ul><footer class="muted small">↑↓ to move · Enter to run · Esc to close</footer></div>` });
  const inp = m.el.querySelector('input'), list = m.el.querySelector('ul');
  let items = [], idx = 0;
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const match = (s) => words.every((w) => s.toLowerCase().includes(w));
    const tc = q ? trades.filter((r) => match(`${r.t.symbol} ${setupNames(r.t).join(' ')} ${date(r.t.entryTime, true)} ${r.t.tags.join(' ')} trade`)).slice(0, 8)
      .map((r) => ({ t: `${r.t.symbol} · ${date(r.t.entryTime, true)}`, sub: `${r.t.direction} · ${setupNames(r.t)[0] || 'no setup'} · ${r.c.outcome === 'open' ? 'open' : money(r.c.net)}`, run: () => openTradeEditor(r.t.id), ic: 'log' })) : [];
    items = [...cmds.filter((c) => !q || match(c.t + ' ' + c.k)), ...tc].slice(0, 14);
    idx = Math.min(idx, Math.max(0, items.length - 1));
    list.innerHTML = items.map((c, i) => `<li role="option" aria-selected="${i === idx}" class="${i === idx ? 'on' : ''}" data-i="${i}">${icon(c.ic, 16)}<span>${esc(c.t)}${c.sub ? `<small class="muted"> ${esc(c.sub)}</small>` : ''}</span></li>`).join('') || '<li class="muted">No matches</li>';
    list.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
  };
  const run = (i) => { const c = items[i]; if (!c) return; m.close(true); setTimeout(c.run, 10); };
  inp.oninput = () => { idx = 0; draw(); };
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); draw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    if (e.key === 'Enter') { e.preventDefault(); run(idx); }
  };
  list.onclick = (e) => { const li = e.target.closest('[data-i]'); if (li) run(+li.dataset.i); };
  draw();
}
function shortcuts() {
  openModal({ title: 'Keyboard shortcuts', size: 'sm', body: `<div class="kbd-grid"><span>Quick add trade</span><kbd>N</kbd><span>Command palette</span><kbd>Ctrl/⌘ K</kbd><span>Save trade</span><kbd>Ctrl/⌘ S</kbd><span>Paste chart into a trade</span><kbd>Ctrl/⌘ V</kbd><span>Close dialog</span><kbd>Esc</kbd><span>Go to dashboard / log / journal / analytics</span><kbd>G then D / L / J / A</kbd><span>This list</span><kbd>?</kbd></div><p class="muted small">The chart annotator has its own shortcuts — press ? inside it.</p>` });
}

// ---------- Boot ----------
async function boot() {
  shell();
  try { const f = JSON.parse(localStorage.getItem('edgebook.filters') || 'null'); if (f) Object.assign(state.filters, f); } catch {}
  await load();
  applyTheme();
  route();
  window.addEventListener('hashchange', route);
  subscribe((kind) => { applyTheme(); rerender(); });

  document.addEventListener('change', (e) => {
    if (e.target.matches('[data-range]')) { state.filters.range = e.target.value; if (e.target.value === 'custom' && !state.filters.from) { state.filters.from = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10); state.filters.to = new Date().toISOString().slice(0, 10); } emit('filters'); }
    if (e.target.matches('[data-from]')) { state.filters.from = e.target.value; emit('filters'); }
    if (e.target.matches('[data-to]')) { state.filters.to = e.target.value; emit('filters'); }
    if (e.target.matches('[data-acc]')) { state.filters.accountId = e.target.value; emit('filters'); }
  });
  document.addEventListener('click', (e) => {
    const t = e.target;
    // Desktop app: open external links in the system browser instead of the app window.
    const ext = t.closest('a[href^="http"]');
    if (ext && window.__TAURI__?.opener?.openUrl) { e.preventDefault(); window.__TAURI__.opener.openUrl(ext.href); return; }
    if (t.closest('[data-palette]')) return palette();
    if (t.closest('[data-new]') && t.closest('.top')) return openNewTrade();
    if (t.closest('[data-quick]')) return openQuickAdd();
    if (t.closest('[data-theme-toggle]')) return setSettings({ theme: state.settings.theme === 'dark' ? 'light' : 'dark' });
    if (t.closest('[data-sample]') && !t.closest('.v-prefs')) return loadSample();
    if (t.closest('.v-prefs [data-sample]')) return loadSample();
    if (t.closest('[data-onboard]')) return openOnboarding();
    if (t.closest('[data-more-nav]')) {
      const m = openModal({ title: 'More', size: 'sm', body: `<nav class="more-nav">${['goals', 'prefs'].map((k) => `<a href="#${k}" data-close>${icon(VIEWS[k].icon, 18)} ${VIEWS[k].label}</a>`).join('')}<button data-close data-palette>${icon('command', 18)} Command palette</button></nav>` });
    }
  });
  let gPending = false;
  document.addEventListener('keydown', (e) => {
    const typing = e.target.matches?.('input, textarea, select, [contenteditable="true"]');
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
    if (mod && e.key.toLowerCase() === 's') e.preventDefault(); // the trade editor handles its own save first
    if (e.key === 'Escape' && topModal()) { e.preventDefault(); topModal().close(); return; }
    if (typing || mod || e.altKey || topModal()) return;
    if (gPending) { gPending = false; const map = { d: 'dashboard', l: 'log', j: 'journal', a: 'analytics', p: 'playbook', g: 'goals', s: 'prefs' }; if (map[e.key]) { location.hash = map[e.key]; return; } }
    if (e.key === 'g') { gPending = true; setTimeout(() => (gPending = false), 900); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); return openQuickAdd(); }
    if (e.key === '?') return shortcuts();
  });
  // A file dropped outside a drop zone would navigate the app window away from the journal.
  const fileDrag = (e) => e.dataTransfer?.types?.includes('Files');
  window.addEventListener('dragover', (e) => { if (fileDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (fileDrag(e)) e.preventDefault(); });
  window.addEventListener('beforeunload', (e) => { if (document.querySelector('.te-modal') && state.draft) { e.preventDefault(); e.returnValue = ''; } });
  if (!state.persistent) setTimeout(() => toast('Storage is blocked in this window, so data lasts until you close it. Export a backup from Settings.', { tone: 'warn', ms: 7000 }), 800);
}
boot();

return {  };
})();
</script>
